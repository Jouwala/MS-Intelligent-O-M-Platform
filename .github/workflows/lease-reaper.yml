# 租约 / 孤儿范围锁回收（ADR-7 §3.7）
#
# GitHub refs 是权威层，不需要中央服务：定时 workflow 调
# apps/control-plane/backend/dispatch/lease_reaper.py 删除过期 lease ref
# 与孤儿 scope ref，并（可选）收敛残留的 state 标签。
#
# 设计要点：
# - 每 5 分钟（cron 最小粒度）+ 可手动 workflow_dispatch；
# - permissions 只需 contents: write（删 refs）与 issues: write（可选标签修正）；
# - 并发组保证同一时刻只有一个 Reaper（多轮重叠没有意义，也浪费 API 配额）；
# - 失败显式：脚本非零退出 → workflow 变红，看日志里的 [reaper] 原因；
#   同时有失败告警（TASK #75）：failure() 步自动开/更新同名告警 Issue
#   通知 owner，不再只靠人去看 Actions 页（口径同 ci-failure-notify：
#   只通知、不改代码、不自动重跑，同一告警 Issue 追加评论不重复开）。
# - 幂等：没有可删项也正常退出 0。HWM ref 默认永不删除。

name: lease-reaper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lease-reaper
  cancel-in-progress: false

jobs:
  reap:
    name: 回收过期租约与孤儿范围锁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行 Reaper（refs 权威层）
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 日志/错误是中文：固定 UTF-8，避免 runner locale 差异导致输出乱码
          PYTHONIOENCODING: utf-8
        # 默认只删过期租约 + 孤儿 scope（HWM 永不删）；要顺手修正 state 标签
        # 可加 `--fix-labels`，要先确认仓库标签口径。
        run: python apps/control-plane/backend/dispatch/lease_reaper.py

      - name: 失败告警（开/更新告警 Issue 通知 owner）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          TITLE="[告警] lease-reaper 运行失败"
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 去重：已有同名 open 告警 Issue 就追加评论，没有才新建。
          EXISTING="$(curl -sS "${AUTH[@]}" "$API/search/issues?q=repo:$REPO+state:open+in:title+%22lease-reaper%22+%22%E5%91%8A%E8%AD%A6%22" | jq -r '.items[0].number // empty')"
          {
            echo "<!-- lease-reaper-alert: run-$RUN_ID -->"
            echo "lease-reaper 本次运行失败（$NOW）。"
            echo
            echo "- 运行记录：$RUN_URL"
            echo "- 排查：打开运行日志看 [reaper] 开头的报错行（失败原因在脚本输出里）。"
            echo "- 影响：本轮过期租约/孤儿范围锁未回收，下一轮定时运行会重试；连续失败请按 docs/workspace/qa-fix-loop.md 与调度设计文档人工介入。"
          } > /tmp/alert.md
          if [ -n "$EXISTING" ]; then
            jq -n --rawfile body /tmp/alert.md '{body: $body}' \
              | curl -sS -X POST "${AUTH[@]}" "$API/issues/$EXISTING/comments" --data-binary @- > /dev/null
            echo "已在既有告警 Issue #$EXISTING 追加失败评论（run $RUN_ID）。"
          else
            jq -n --arg title "$TITLE" --rawfile body /tmp/alert.md '{title: $title, body: $body}' \
              | curl -sS -X POST "${AUTH[@]}" "$API/issues" --data-binary @- > /dev/null
            echo "已新建告警 Issue（run $RUN_ID）。"
          fi
