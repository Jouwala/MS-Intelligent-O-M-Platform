# 租约 / 孤儿范围锁回收（ADR-7 §3.7）
#
# GitHub refs 是权威层，不需要中央服务：定时 workflow 调
# apps/control-plane/backend/dispatch/lease_reaper.py 删除过期 lease ref
# 与孤儿 scope ref，并收敛残留的 state 标签。
#
# 设计要点：
# - 每 5 分钟（cron 最小粒度）+ 可手动 workflow_dispatch；
# - permissions 只需 contents: write（删 refs）与 issues: write（标签修正 /
#   认领超时评论）；
# - 并发组保证同一时刻只有一个 Reaper（多轮重叠没有意义，也浪费 API 配额）；
# - 失败显式：脚本非零退出 → workflow 变红，看日志里的 [reaper] / [claim-expiry]
#   原因；同时有失败告警（TASK #75）：failure() 步调 alert_inbox.py 把失败路由到
#   Muse 1 告警收件箱（#143，只留最新一次失败，不另开 Issue、不刷屏；检出失败
#   时退化为直接追加一条最小告警）。
# - 每轮多一步「认领 / 分派超时过期」：认领后 4 小时无进展的 Issue 发
#   CLAIM_EXPIRED 评论、标签收敛回 state:todo（日志末尾 [claim-expiry] 巡检 N 个 Issue），
#   同时往收件箱发 no-progress 告警（#143）；分派后 24 小时无人认领由 auto-dispatch
#   在就绪判断里放行重派，不在这里改标签。
# - 每轮多一步「阻塞升级」：扫 state:blocked 的 open Issue，高优先级（P0/P1）立即、
#   普通满 30 分钟后升级到收件箱（--alert-blocked，#143）。
# - --fix-labels 每轮都开：租约回收后残留的 state:claimed 标签即时收敛回
#   state:todo，不再等 4 小时认领过期（P1-4）。
# - Reaper→dispatch：本轮释放了任务（reaped > 0）时即时触发一次自动分派，
#   不等每小时巡检（P1-4）；无释放时不空跑。
# - 静默卡住检查：每轮查无负责人（无 agent 标签）的 state:todo 任务，
#   有则开/更新同名告警 Issue（P1-4）。
# - 幂等：没有可删项也正常退出 0。HWM ref 默认永不删除。

name: lease-reaper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lease-reaper
  cancel-in-progress: false

jobs:
  reap:
    name: 回收过期租约与孤儿范围锁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行 Reaper（refs 权威层）
        id: reap
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 日志/错误是中文：固定 UTF-8，避免 runner locale 差异导致输出乱码
          PYTHONIOENCODING: utf-8
        # 默认只删过期租约 + 孤儿 scope（HWM 永不删）；--claim-expiry 是每轮
        # 必跑的「认领超时过期」一步；--fix-labels 把回收后残留的 state:claimed
        # 标签即时收敛回 state:todo（不再等 4 小时认领过期）；--alert-blocked
        # 是每轮必跑的「阻塞升级」一步（#143）。
        # Reaper 本轮释放了任务时（reaped > 0），下一步即时触发一次自动分派，
        # 不等每小时巡检（P1-4）。
        run: python apps/control-plane/backend/dispatch/lease_reaper.py --claim-expiry --fix-labels --alert-blocked

      - name: 释放任务后即时分派（Reaper→dispatch）
        if: steps.reap.outputs.reaped > 0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: schedule
          PYTHONIOENCODING: utf-8
        run: python apps/control-plane/backend/dispatch/auto_dispatch.py

      - name: 无负责人任务告警（静默卡住检查）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          # 找 open 的 state:todo Issue 里没有 agent:* 标签的（对分派永久不可见）。
          # 列表端点也会返回 PR（带 pull_request 键），须排除；跟 Link 分页拉满，
          # 不只取前 100 条（仓库 Issue 已过 130）。
          : > /tmp/ownerless_list.txt
          URL="$API/issues?state=open&labels=state:todo&per_page=100"
          while [ -n "$URL" ]; do
            curl -sS -D /tmp/ownerless_headers.txt "${AUTH[@]}" "$URL" \
              | jq -r '.[] | select(.pull_request | not) | select(.labels | map(.name) | map(test("^agent:")) | any | not) | "#\(.number) \(.title)"' >> /tmp/ownerless_list.txt
            # 单页结果时 GitHub 不返回 Link 头，grep 退出 1；pipefail + set -e
            # 会直接杀死整个步骤，故管道末尾加 || true（无 next 链接即结束循环）。
            URL="$(grep -i '^Link:' /tmp/ownerless_headers.txt | tr ',' '\n' | sed -n 's/.*<\([^>]*\)>; rel="next".*/\1/p' | head -n 1 || true)"
          done
          OWNERLESS="$(cat /tmp/ownerless_list.txt)"
          if [ -z "$OWNERLESS" ]; then
            echo "无无负责人 state:todo 任务，无需告警。"
            exit 0
          fi
          echo "发现无负责人 state:todo 任务："
          echo "$OWNERLESS"
          TITLE="[告警] 存在无负责人任务（分派不可见）"
          # 去重：已有同名 open 告警 Issue 就地更新最新一条同类评论（PATCH），
          # 不再每 5 分钟追加一条（否则一日约 288 条重复评论刷屏）；没有同类
          # 评论时才 POST 新评论，没有同名 Issue 时才新建。
          EXISTING="$(curl -sS "${AUTH[@]}" "$API/search/issues?q=repo:$REPO+state:open+in:title+%22%E5%AD%98%E5%9C%A8%E6%97%A0%E8%B4%9F%E8%B4%A3%E4%BA%BA%E4%BB%BB%E5%8A%A1%22" | jq -r '.items[0].number // empty')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "<!-- ownerless-alert: $(date -u +%Y%m%dT%H%M%SZ) -->"
            echo "以下 state:todo 任务没有 agent 标签，auto-dispatch 永远不会分派它们（$NOW）。"
            echo
            echo "$OWNERLESS" | sed 's/^/- /'
            echo
            echo "请 Muse 1 确认负责人后补 agent 标签，或关闭不需要的任务。"
          } > /tmp/ownerless.md
          if [ -n "$EXISTING" ]; then
            COMMENT_ID="$(curl -sS "${AUTH[@]}" "$API/issues/$EXISTING/comments?per_page=100" \
              | jq -r '[.[] | select((.body // "") | contains("ownerless-alert:")) | .id] | last // empty')"
            if [ -n "$COMMENT_ID" ]; then
              jq -n --rawfile body /tmp/ownerless.md '{body: $body}' \
                | curl -sS -X PATCH "${AUTH[@]}" "$API/issues/$EXISTING/comments/$COMMENT_ID" --data-binary @- > /dev/null
              echo "已就地更新既有告警 Issue #$EXISTING 的同类评论（comment $COMMENT_ID）。"
            else
              jq -n --rawfile body /tmp/ownerless.md '{body: $body}' \
                | curl -sS -X POST "${AUTH[@]}" "$API/issues/$EXISTING/comments" --data-binary @- > /dev/null
              echo "已在既有告警 Issue #$EXISTING 发第一条清单评论。"
            fi
          else
            jq -n --arg title "$TITLE" --rawfile body /tmp/ownerless.md '{title: $title, body: $body}' \
              | curl -sS -X POST "${AUTH[@]}" "$API/issues" --data-binary @- > /dev/null
            echo "已新建告警 Issue。"
          fi

      - name: 失败告警（路由到 Muse 1 告警收件箱）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -f apps/control-plane/backend/dispatch/alert_inbox.py ]; then
            python apps/control-plane/backend/dispatch/alert_inbox.py reaper-failure \
              --run-id "${{ github.run_id }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            # 检出失败时 CLI 不在磁盘上：退化为直接往收件箱追加一条最小告警
            #（按标题找收件箱；下一轮 CLI 成功时会就地更新这条同 marker 评论）。
            set -euo pipefail
            API="https://api.github.com/repos/$REPO"
            AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
            INBOX="$(curl -sS "${AUTH[@]}" "$API/search/issues?q=repo:$REPO+state:open+in:title+%22%E5%91%8A%E8%AD%A6%E6%94%B6%E4%BB%B6%E7%AE%B1%22" | jq -r '.items[] | select(.title == "[告警收件箱] Muse 1") | .number' | head -n 1)"
            if [ -n "$INBOX" ]; then
              {
                echo "<!-- muse1-alert: reaper-failure:latest -->"
                echo
                echo "## lease-reaper 运行失败"
                echo
                echo "- 任务/PR：lease-reaper（每 5 分钟定时）"
                echo "- 原因：本次运行失败（run ${{ github.run_id }}），且检出失败、告警 CLI 不可用（退化通知）。"
                echo "- 运行记录：https://github.com/$REPO/actions/runs/${{ github.run_id }}"
              } > /tmp/alert-fallback.md
              jq -n --rawfile body /tmp/alert-fallback.md '{body: $body}' \
                | curl -sS -X POST "${AUTH[@]}" "$API/issues/$INBOX/comments" --data-binary @- > /dev/null
              echo "检出失败，已用退化方式往收件箱 #${INBOX} 追加告警。"
            else
              echo "检出失败且找不到收件箱 Issue，告警发不出去。"
            fi
          fi
